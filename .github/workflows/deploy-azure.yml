# Deploy TRACEWIRE to Azure on every push to main.
#
# - Detects which parts changed and deploys only those (backend, frontend, or both).
# - Tests/typechecks must pass before anything is deployed.
# - "Run workflow" (workflow_dispatch) deploys both regardless of changes.
#
# Auth: GitHub OIDC -> user-assigned managed identity `forkverse-github-deploy`
# (Contributor on resource group forkverse-rg; federated credential trusts only
# refs/heads/main of this repo). No Azure passwords are stored in GitHub.
# Repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC login to Azure

# One deploy at a time; a newer push waits instead of racing the previous one.
concurrency:
  group: deploy-azure
  cancel-in-progress: false

env:
  RG: forkverse-rg
  ACR: forkverseacrqb1xft
  APP: forkverse-backend
  BACKEND_FQDN: forkverse-backend.orangebeach-cf28400b.germanywestcentral.azurecontainerapps.io
  SA: forkversewebqb1xft
  NODE_VERSION: '22'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image
        run: |
          IMG="$ACR.azurecr.io/forkverse-backend:${GITHUB_SHA::12}"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          az acr login -n "$ACR"
          docker build --platform linux/amd64 -t "$IMG" .
          docker push "$IMG"

      - name: Roll out to Container App
        run: |
          az containerapp update -g "$RG" -n "$APP" --image "$IMG" -o none
          for i in $(seq 1 30); do
            if curl -fsS "https://$BACKEND_FQDN/api/hello" >/dev/null; then echo "Backend healthy: https://$BACKEND_FQDN"; exit 0; fi
            sleep 10
          done
          echo "Backend did not become healthy" >&2
          exit 1

  frontend:
    needs: [changes, backend]
    # Run after the backend job when both changed; still run if the backend job was skipped.
    if: ${{ !cancelled() && needs.changes.outputs.frontend == 'true' && needs.backend.result != 'failure' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run check

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build against the deployed backend
        run: |
          VITE_API_BASE_URL="https://$BACKEND_FQDN" VITE_WS_URL="wss://$BACKEND_FQDN/ws" npx vite build --emptyOutDir

      - name: Upload to Storage static website
        run: |
          az storage blob upload-batch -d '$web' -s dist --account-name "$SA" --auth-mode key --overwrite -o none
          WEB=$(az storage account show -g "$RG" -n "$SA" --query primaryEndpoints.web -o tsv)
          curl -fsS -o /dev/null "$WEB" && echo "Frontend live: $WEB"
