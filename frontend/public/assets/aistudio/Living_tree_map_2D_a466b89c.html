<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Living tree map 2D</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg1:#0b1736; --bg2:#02040a; --ink:#eef2fb; --muted:#8e9bb8; --glass:rgba(5,9,20,.76);
  --edge:rgba(255,255,255,.14); --ember:#ff9a4d;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;color:var(--ink);font:15px/1.55 "Hanken Grotesk",system-ui,sans-serif;font-weight:300;
  background:radial-gradient(ellipse at 50% 60%,var(--bg1),var(--bg2) 75%);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#nav{position:absolute;left:32px;bottom:12vh;margin:0;padding:0;list-style:none;z-index:4}
#nav li{position:relative;padding:4px 0;color:var(--muted);cursor:pointer;font-size:14px;transition:color .15s}
#nav li:hover,#nav li.sel{color:#fff}
#nav li.sel::before{content:"";position:absolute;left:-32px;top:5px;width:6px;height:20px;background:#fff}
#nav li:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
#top{position:absolute;left:32px;top:22px;right:32px;display:flex;gap:12px;align-items:center;z-index:4}
#top h1{margin:0;font-size:16px;font-weight:400;flex:1}
#top button{font:inherit;color:#fff;background:rgba(255,255,255,.1);border:1px solid var(--edge);border-radius:10px;padding:6px 14px;cursor:pointer;backdrop-filter:blur(8px)}
#top button:hover{background:rgba(255,255,255,.2)}
#hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--muted);font-size:12px;pointer-events:none}
#focus{position:absolute;left:50%;top:50%;width:min(480px,calc(100% - 40px));transform:translate(-50%,-48%);
  background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--edge);border-radius:18px;padding:28px 30px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
#focus.show{opacity:1;transform:translate(-50%,-50%)}
#focus .tag{font-size:13px;color:var(--muted)}
#focus h2{margin:10px 0 12px;font-size:38px;line-height:1.1;font-weight:300}
#focus p{margin:0 0 14px}
#focus .meta{font-size:13px;color:var(--muted)}
#panel{position:absolute;right:20px;top:70px;width:min(290px,calc(100% - 40px));background:var(--glass);backdrop-filter:blur(14px);
  border:1px solid var(--edge);border-radius:14px;padding:14px;display:grid;gap:8px;z-index:6}
#panel[hidden]{display:none}
#panel label{font-size:12px;color:var(--muted)}
#panel input{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--edge);border-radius:8px;background:rgba(255,255,255,.06);color:#fff}
#panel button{font:inherit;cursor:pointer;border-radius:8px;padding:7px 10px;border:1px solid var(--edge);background:rgba(255,255,255,.1);color:#fff}
#panel button.go{background:var(--ember);border-color:var(--ember);color:#1a0e04;font-weight:500}
@media (max-width:640px){#nav{bottom:60px;left:20px}#nav li.sel::before{left:-20px}#focus h2{font-size:28px}}
</style>
</head>
<body>
<canvas id="c" aria-label="Animated 2D tree map. Hover nodes to focus them, drag to pan, scroll to zoom."></canvas>
<div id="top"><h1>Living tree map</h1><button id="motion" aria-pressed="true">Pause motion</button><button id="fit">Fit view</button><button id="plus" aria-expanded="false">+ Add</button></div>
<ul id="nav" aria-label="Main nodes"></ul>
<div id="focus" role="status" aria-live="polite"></div>
<div id="panel" hidden>
  <label for="nm">Name</label><input id="nm" maxlength="40" placeholder="e.g. Fungi">
  <label for="inf">Description</label><input id="inf" maxlength="160" placeholder="Shown in the focus card">
  <button class="go" id="addBranch">Add branch to <span id="selName"></span></button>
  <button id="addMain">Add main node</button>
</div>
<div id="hint">Hover a node to bring it into focus · drag to pan · scroll to zoom</div>

<script>
const data = { spine: [
  { name: "Birds", info: "Nuthatches, woodpeckers and jays rely on oaks for food, nest holes and winter shelter.", branches: [
    { name: "Jay", info: "Buries thousands of acorns each autumn and plants many new oaks without meaning to." },
    { name: "Great spotted woodpecker", info: "Drums on dead limbs and nests in softened heartwood." } ] },
  { name: "Fungi", info: "Networks of threads under the soil trade nutrients with oak roots.", branches: [
    { name: "Chicken of the woods", info: "A bright shelf fungus that slowly breaks down old heartwood." },
    { name: "Truffle", info: "Grows underground in partnership with the roots." },
    { name: "Honey fungus", info: "A spreading species that can live for centuries." } ] },
  { name: "Insects", info: "A single mature oak can host hundreds of insect species.", branches: [
    { name: "Stag beetle", info: "Larvae spend years feeding in rotting oak wood." },
    { name: "Purple hairstreak", info: "A butterfly that lives almost entirely in the canopy." } ] },
  { name: "Soft settlers", info: "Mosses and lichens that mark an old, stable habitat.", branches: [
    { name: "Squirrel-tail moss", info: "Forms neat, low mats on shaded bark of mature trees." },
    { name: "Lungwort", info: "A leafy lichen that only thrives where the air is clean." } ] },
  { name: "Unlikely inhabitants", info: "Surprising guests that shelter in cracks, hollows and leaf litter.", branches: [] }
]};

const PAL = ["#ff9a4d", "#e8682c", "#3fc1c9", "#5b8def", "#9fd8ff", "#f3e6c4"];
const OLIVE = ["#c9c36a", "#8fa04a", "#e6dd9a", "#5f7a3a", "#f3e6c4"];
const GAP = 300, FALL = 190;
const canvas = document.getElementById("c"), ctx = canvas.getContext("2d"), box = document.getElementById("focus");
const dpr = Math.min(devicePixelRatio || 1, 2);
let cw = 0, ch = 0, view = { k: 1, x: 0, y: 0 }, goal = null;
let ground, groups = [], sel = 0, focus = null, moving = true, T = 0, bounds = { x0: 0, x1: 1, y0: 0, y1: 1 };

function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const pick = (a, r) => a[(r() * a.length) | 0];
const bez = (p, t) => { const u = 1 - t; return [u*u*u*p[0][0] + 3*u*u*t*p[1][0] + 3*u*t*t*p[2][0] + t*t*t*p[3][0], u*u*u*p[0][1] + 3*u*u*t*p[1][1] + 3*u*t*t*p[2][1] + t*t*t*p[3][1]]; };

// Glow sprite for branch orbs
const glow = document.createElement("canvas"); glow.width = glow.height = 64;
{ const g = glow.getContext("2d"), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.25, "rgba(190,225,255,.6)"); gr.addColorStop(1, "rgba(120,180,255,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }

// Procedural branch growth: every seed gives a different length, curl, lean and forking pattern
function growBranch(grp, cx, side, k, seed) {
  const r = rng(seed), tr = { len: 130 + k * 55 + r() * 140, curl: .04 + r() * .2, spread: .4 + r() * .8, fork: .012 + r() * .03, pull: .01 + r() * .05, lean: side * (.1 + r() * .75) };
  const o = { limb: [], maxD: 0, minY: 0, minX: cx, maxX: cx, reach: 0, prog: 0 };
  function walk(x, y, ang, len, d, depth) {
    const step = 5, n = Math.max(3, (len / step) | 0);
    for (let s = 0; s < n; s++) {
      ang += (r() - .5) * 2 * tr.curl + (-Math.PI / 2 - ang) * tr.pull;
      x += Math.cos(ang) * step; y += Math.sin(ang) * step; d += step;
      if (depth === 0) o.limb.push([x, y, d]);
      o.maxD = Math.max(o.maxD, d); o.minY = Math.min(o.minY, y); o.minX = Math.min(o.minX, x); o.maxX = Math.max(o.maxX, x);
      const cnt = depth === 0 ? 5 : depth === 1 ? 3 : 2, sp = Math.max(1.5, 7 - depth * 2 - (s / n) * 3);
      for (let q = 0; q < cnt; q++) grp.parts.push({ x: x + (r() - .5) * sp, y: y + (r() - .5) * sp, s: r() * 6.28, r: (.4 + r() * 1.2) * (1 - depth * .15), c: pick(PAL, r), d: d + r() * 4, br: o });
      if (depth < 3 && s > 2 && r() < tr.fork * (depth === 0 ? 1.6 : 1)) walk(x, y, ang + (r() < .5 ? -1 : 1) * tr.spread * (.5 + r()), (n - s) * step * (.35 + r() * .4), d, depth + 1);
    }
  }
  walk(cx, -28, -Math.PI / 2 + tr.lean, tr.len, 0, 0);
  const tip = o.limb[o.limb.length - 1];
  o.x = tip[0]; o.y = tip[1]; o.lean = o.x >= cx ? 1 : -1; o.tx = o.x + o.lean * 16; o.ty = o.y + 4; o.dur = Math.max(1.8, o.maxD / 110);
  return o;
}

function build(fit) {
  groups = []; focus = null; hideCard();
  const n = data.spine.length, r0 = rng(7), W = (n - 1) * GAP; let minY = -120, bx0 = -160, bx1 = W + 160;
  ground = { dim: 1, parts: [] };
  for (let i = 0; i < n * 480; i++) ground.parts.push({ x: -140 + r0() * (W + 280), y: (r0() - .5) * 9, s: r0() * 6.28, r: .5 + r0() * 1.4, c: pick(PAL, r0) });
  for (let i = 0; i < n * 80; i++) ground.parts.push({ x: -140 + r0() * (W + 280), y: 8, s: r0() * 6.28, r: .5 + r0() * 1.1, c: pick(PAL, r0), fall: .15 + r0() * .5, ph: r0() });

  data.spine.forEach((m, i) => {
    const cx = i * GAP, grp = { i, dim: 1, parts: [], orbs: [], hot: 1, lensDots: [] };
    (m.branches || []).forEach((b, j) => {
      if (b.seed === undefined) b.seed = i * 131 + j * 17 + 3;
      if (b._prog === undefined) b._prog = 1;
      const o = growBranch(grp, cx, j % 2 ? 1 : -1, Math.floor(j / 2), b.seed);
      minY = Math.min(minY, o.minY - 40); bx0 = Math.min(bx0, o.minX - 120); bx1 = Math.max(bx1, o.maxX + 120);
      Object.assign(o, { j, b, hot: 0, prog: b._prog }); o.reach = (1 - Math.pow(1 - o.prog, 3)) * o.maxD; grp.orbs.push(o);
    });
    const r = rng(i * 53 + 11);
    for (let q = 0; q < 110; q++) { const a = r() * 6.283, rad = Math.sqrt(r()) * 25; grp.lensDots.push({ x: Math.cos(a) * rad, y: Math.sin(a) * rad, r: .5 + r() * 1.2, c: pick(OLIVE, r), s: r() * 6.28 }); }
    grp.x = cx; groups.push(grp);
  });
  bounds = { x0: bx0, x1: bx1, y0: minY - 30, y1: FALL + 40 };

  const nav = document.getElementById("nav"); nav.replaceChildren();
  data.spine.forEach((m, i) => {
    const li = document.createElement("li"); li.textContent = m.name; li.tabIndex = 0; if (i === sel) li.className = "sel";
    li.onmouseenter = li.onfocus = () => setFocus({ i }); li.onmouseleave = li.onblur = () => setFocus(null);
    li.onclick = () => choose(i); li.onkeydown = e => { if (e.key === "Enter") choose(i); };
    nav.append(li);
  });
  document.getElementById("selName").textContent = data.spine[sel] ? data.spine[sel].name : "";
  if (fit) fitView(true);
}

function showCard(tag, title, info, meta) {
  box.replaceChildren();
  const t = document.createElement("div"); t.className = "tag"; t.textContent = tag;
  const h = document.createElement("h2"); h.textContent = title;
  const p = document.createElement("p"); p.textContent = info || "No description yet.";
  box.append(t, h, p);
  if (meta) { const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; box.append(m); }
  box.classList.add("show");
}
const hideCard = () => box.classList.remove("show");
function setFocus(f) {
  if ((!f && !focus) || (f && focus && f.i === focus.i && f.j === focus.j)) return;
  focus = f; if (!f) { hideCard(); return; }
  const m = data.spine[f.i];
  if (f.j === undefined) { const k = (m.branches || []).length;
    showCard(`Main node ${f.i + 1} of ${data.spine.length}`, m.name, m.info, k ? "Branches: " + m.branches.map(b => b.name).join(", ") : "No branches yet"); }
  else { const b = m.branches[f.j]; showCard("Branch of " + m.name, b.name, b.info); }
}
function choose(i) { sel = i; build(false); }

function resize() {
  cw = canvas.clientWidth; ch = canvas.clientHeight; canvas.width = cw * dpr; canvas.height = ch * dpr;
}
function fitView(instant) {
  const w = bounds.x1 - bounds.x0, h = bounds.y1 - bounds.y0, k = Math.min(1.2, Math.min((cw - 120) / w, (ch - 140) / h));
  goal = { k, x: cw / 2 - (bounds.x0 + w / 2) * k, y: ch / 2 - (bounds.y0 + h / 2) * k };
  if (instant) { view = { ...goal }; goal = null; }
}
addEventListener("resize", () => { resize(); fitView(true); });

// Pointer: hover, pan, zoom, click
let drag = null, ptr = { x: 0, y: 0 };
const toWorld = (px, py) => [(px - view.x) / view.k, (py - view.y) / view.k];
function hitTest(px, py) {
  const [x, y] = toWorld(px, py); let best = null, bd = 1e9;
  groups.forEach(g => {
    const d = Math.hypot(x - g.x, y); if (d < 38 && d < bd) { bd = d; best = { i: g.i }; }
    g.orbs.forEach(o => { if (o.prog < 1) return; const dd = Math.hypot(x - o.x, y - o.y); if (dd < 22 && dd < bd) { bd = dd; best = { i: g.i, j: o.j }; } });
  });
  return best;
}
canvas.addEventListener("pointerdown", e => { canvas.setPointerCapture(e.pointerId); drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false }; goal = null; });
canvas.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect(); ptr = { x: e.clientX - r.left, y: e.clientY - r.top };
  if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.hypot(dx, dy) > 5) drag.moved = true;
    if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; canvas.style.cursor = "grabbing"; setFocus(null); return; } }
  const h = hitTest(ptr.x, ptr.y); canvas.style.cursor = h ? "pointer" : "grab"; setFocus(h);
});
canvas.addEventListener("pointerup", () => {
  if (drag && !drag.moved) { const h = hitTest(ptr.x, ptr.y); if (h) choose(h.i); }
  drag = null;
});
canvas.addEventListener("pointerleave", () => { if (!drag) setFocus(null); });
canvas.addEventListener("wheel", e => {
  e.preventDefault(); const r = canvas.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
  const f = Math.exp(-e.deltaY * 0.0015), k = Math.max(.2, Math.min(3, view.k * f)), s = k / view.k;
  view.x = px - (px - view.x) * s; view.y = py - (py - view.y) * s; view.k = k; goal = null;
}, { passive: false });

// Rendering
function dots(parts, dim, drift) {
  for (const p of parts) {
    if (p.br && p.d > p.br.reach) continue;
    const tw = .6 + .4 * Math.sin(T * 1.6 + p.s * 3);
    let x = p.x + Math.sin(T * .6 + p.s) * drift, y = p.y + Math.cos(T * .5 + p.s * 1.3) * drift, a = tw * dim * (.6 + .4 * Math.sin(p.s * 7));
    if (p.fall) { const f = ((T * p.fall * 40 + p.ph * FALL) % FALL); y += f; a *= 1 - f / FALL; }
    if (p.br && p.br.prog < 1) a *= 1 + Math.max(0, 1 - (p.br.reach - p.d) / 30) * 1.6;
    ctx.globalAlpha = a; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.283); ctx.fill();
  }
}
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, .05); last = now; if (moving) T += dt;
  if (goal) { view.k += (goal.k - view.k) * .12; view.x += (goal.x - view.x) * .12; view.y += (goal.y - view.y) * .12;
    if (Math.abs(goal.k - view.k) < .001 && Math.abs(goal.x - view.x) < .5) goal = null; }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(dpr * view.k, 0, 0, dpr * view.k, dpr * view.x, dpr * view.y);
  ground.dim += ((focus ? .4 : 1) - ground.dim) * .1;
  ctx.globalCompositeOperation = "lighter"; dots(ground.parts, ground.dim, 1.2);
  ctx.textBaseline = "alphabetic"; ctx.font = '400 13px "Hanken Grotesk", system-ui, sans-serif';
  for (const g of groups) {
    const on = !focus || focus.i === g.i, hotMain = focus && focus.i === g.i && focus.j === undefined;
    g.dim += ((on ? 1 : .1) - g.dim) * .1; g.hot += ((hotMain ? 1.2 : 1) - g.hot) * .15;
    ctx.globalCompositeOperation = "lighter"; dots(g.parts, g.dim, 1.6);
    for (const o of g.orbs) {
      if (o.b._prog < 1) o.b._prog = moving ? Math.min(1, o.b._prog + dt / o.dur) : 1;
      o.prog = o.b._prog; o.reach = (1 - Math.pow(1 - o.prog, 3)) * o.maxD;
      const hot = focus && focus.i === g.i && focus.j === o.j; o.hot += ((hot ? 1 : 0) - o.hot) * .15;
      if (o.prog < 1) { let f = o.limb[0]; for (const q of o.limb) { if (q[2] <= o.reach) f = q; else break; }
        ctx.globalAlpha = g.dim; ctx.drawImage(glow, f[0] - 24, f[1] - 24, 48, 48); }
      const born = Math.max(0, (o.prog - .85) / .15), sz = (26 + o.hot * 26 + Math.sin(T * 2 + o.j) * 2) * born;
      if (sz > 0) { ctx.globalAlpha = g.dim; ctx.drawImage(glow, o.x - sz / 2, o.y - sz / 2, sz, sz); }
    }
    // main lens
    ctx.globalCompositeOperation = "source-over"; ctx.save(); ctx.translate(g.x, 0); ctx.scale(g.hot, g.hot);
    ctx.globalAlpha = g.dim; ctx.fillStyle = "#03060d"; ctx.beginPath(); ctx.arc(0, 0, 30, 0, 6.283); ctx.fill();
    ctx.strokeStyle = hotMain ? "#fff" : "rgba(255,255,255,.55)"; ctx.lineWidth = hotMain ? 3 : 1.5;
    if (hotMain) { ctx.shadowColor = "#8fd0ff"; ctx.shadowBlur = 16; } ctx.stroke(); ctx.shadowBlur = 0;
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, 28, 0, 6.283); ctx.clip();
    const rot = T * (hotMain ? .5 : .12), cr = Math.cos(rot), sr = Math.sin(rot);
    for (const d of g.lensDots) { ctx.globalAlpha = g.dim * (.55 + .45 * Math.sin(T * 1.5 + d.s * 3)); ctx.fillStyle = d.c;
      ctx.beginPath(); ctx.arc(d.x * cr - d.y * sr, d.x * sr + d.y * cr, d.r, 0, 6.283); ctx.fill(); }
    ctx.restore();
    if (g.i === sel) { ctx.globalAlpha = g.dim; ctx.strokeStyle = "#ff9a4d"; ctx.lineWidth = 1.5; ctx.setLineDash([2, 5]); ctx.lineDashOffset = -T * 6;
      ctx.beginPath(); ctx.arc(0, 0, 38, 0, 6.283); ctx.stroke(); ctx.setLineDash([]); }
    ctx.restore();
    // labels
    ctx.globalAlpha = g.dim; ctx.fillStyle = hotMain ? "#fff" : "#cfd8ea"; ctx.textAlign = "center"; ctx.fillText(data.spine[g.i].name, g.x, 62);
    for (const o of g.orbs) { ctx.globalAlpha = g.dim * Math.max(0, (o.prog - .9) / .1); ctx.fillStyle = o.hot > .5 ? "#fff" : "#cfd8ea"; ctx.textAlign = o.lean > 0 ? "left" : "right"; ctx.fillText(o.b.name, o.tx, o.ty); }
  }
  ctx.globalAlpha = 1;
}

// UI
const nm = document.getElementById("nm"), inf = document.getElementById("inf"), panel = document.getElementById("panel"), plus = document.getElementById("plus"), motion = document.getElementById("motion");
const read = () => { const name = nm.value.trim(); if (!name) { nm.focus(); return null; } return { name, info: inf.value.trim() }; };
plus.onclick = () => { panel.hidden = !panel.hidden; plus.setAttribute("aria-expanded", String(!panel.hidden)); };
document.getElementById("addBranch").onclick = () => { const v = read(); if (!v) return; (data.spine[sel].branches ||= []).push({ ...v, seed: (Math.random() * 2147483647) | 0, _prog: 0 }); nm.value = inf.value = ""; build(false); fitView(false); };
document.getElementById("addMain").onclick = () => { const v = read(); if (!v) return; data.spine.push({ ...v, branches: [] }); sel = data.spine.length - 1; nm.value = inf.value = ""; build(true); fitView(false); };
document.getElementById("fit").onclick = () => fitView(false);
motion.onclick = () => { moving = !moving; motion.setAttribute("aria-pressed", String(moving)); motion.textContent = moving ? "Pause motion" : "Resume motion"; };
if (matchMedia("(prefers-reduced-motion: reduce)").matches) motion.click();
resize(); build(true); requestAnimationFrame(frame);
</script>
</body>
</html>
