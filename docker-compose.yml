services:
  db:
    # Single-node replica set with mongot: supports transactions and $vectorSearch.
    image: mongodb/mongodb-atlas-local:8
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_USER:-forkverse}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-change-me}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
      - mongoconfig:/data/configdb
      - mongot:/data/mongot
    # The image ships its own HEALTHCHECK.

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-forkverse}:${MONGO_PASSWORD:-change-me}@db:27017/?directConnection=true&authSource=admin
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  mongodata:
  mongoconfig:
  mongot:
